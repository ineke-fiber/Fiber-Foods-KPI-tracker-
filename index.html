<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Foods — KPI Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ee;
  --surface:#fff;
  --surface2:#faf9f6;
  --border:#e4e0d8;
  --border2:#d4cfc4;
  --accent:#4a7c3f;
  --accent2:#6aab5a;
  --accent-light:#eaf4e7;
  --pink:#c85a8a;
  --pink-light:#faedf4;
  --text1:#1a1a18;
  --text2:#4a4a42;
  --text3:#8a8a7a;
  --gold:#b8902a;
  --gold-light:#fdf6e3;
  --sidebar-w:240px;
  --header-h:60px;
  --radius:12px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-md:0 4px 24px rgba(0,0,0,.1);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text1);font-size:14px}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
#loading-screen .logo{font-family:'DM Serif Display',serif;font-size:28px;color:#fff;letter-spacing:.02em}
#loading-screen .sub{color:rgba(255,255,255,.75);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh}
.topbar{height:var(--header-h);background:var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-btn{background:none;border:none;cursor:pointer;color:#fff;padding:6px;border-radius:8px;display:flex;align-items:center}
.menu-btn:hover{background:rgba(255,255,255,.15)}
.topbar-title{font-family:'DM Serif Display',serif;font-size:18px;color:#fff}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.year-badge{background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s}
.btn-save{background:#fff;color:var(--accent);font-weight:600}
.btn-save:hover{background:#f0f0eb;transform:translateY(-1px)}

.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;transition:transform .2s;padding:12px 0}
.sidebar.hidden{transform:translateX(-100%);position:absolute;top:var(--header-h);bottom:0;z-index:50;box-shadow:var(--shadow-md)}
.main{flex:1;overflow-y:auto;padding:24px}

/* ── SIDEBAR ── */
.nav-section{padding:4px 12px;margin-top:8px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;padding:6px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:400;transition:all .12s;margin-bottom:1px}
.nav-item:hover{background:var(--bg);color:var(--text1)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.nav-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--bg)}
.region-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 2px;margin-top:4px}

/* ── PAGE COMMON ── */
.page-header{margin-bottom:24px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--text1);line-height:1.1}
.page-sub{font-size:13px;color:var(--text3);margin-top:4px}

/* ── HOME / COMPANY TARGETS ── */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.ct-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:box-shadow .15s}
.ct-card:hover{box-shadow:var(--shadow)}
.ct-card.green{border-left:3px solid var(--accent)}
.ct-card.pink{border-left:3px solid var(--pink)}
.ct-card-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ct-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text1);background:var(--bg);transition:border .12s}
.ct-input:focus{outline:none;border-color:var(--accent)}
.ct-card-desc{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.4}
.ct-section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;display:flex;align-items:center;gap:6px}
.ct-notes{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:20px}
.ct-notes-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.ct-notes textarea{width:100%;min-height:160px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);background:var(--bg);resize:vertical;line-height:1.6}
.ct-notes textarea:focus{outline:none;border-color:var(--accent)}

/* ── OVERVIEW ── */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.ov-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ov-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;margin:0 auto 10px}
.ov-name{font-weight:600;font-size:14px}
.ov-role{font-size:11px;color:var(--text3);margin-top:2px;margin-bottom:10px}
.ov-prog{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px}
.ov-prog-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.ov-prog-label{font-size:11px;color:var(--text3)}

/* ── KPI PERSON VIEW ── */
.person-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.person-avatar-lg{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.person-name{font-family:'DM Serif Display',serif;font-size:22px}
.person-role{font-size:13px;color:var(--text3);margin-top:2px}
.kpi-cards{display:flex;flex-direction:column;gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s}
.kpi-card:hover{box-shadow:var(--shadow)}
.kpi-card-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.kpi-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-num.personal{background:var(--pink)}
.kpi-card-title{flex:1;font-weight:600;font-size:14px}
.kpi-expand{font-size:16px;color:var(--text3);transition:transform .2s}
.kpi-card.open .kpi-expand{transform:rotate(180deg)}
.kpi-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.kpi-card.open .kpi-body{display:block}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kpi-field-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.kpi-textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text1);background:var(--bg);resize:vertical;min-height:64px;line-height:1.5}
.kpi-textarea:focus{outline:none;border-color:var(--accent)}
.score-wrap{display:flex;flex-direction:column}
.score-stars{display:flex;gap:4px;margin-top:4px}
.star{font-size:20px;cursor:pointer;color:var(--border2);transition:color .1s,transform .1s}
.star.on{color:var(--gold)}
.star:hover{transform:scale(1.2)}
.kpi-mid,.kpi-eoy{background:var(--bg);border-radius:8px;padding:12px;margin-top:12px}
.kpi-mid-label,.kpi-eoy-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-mid-label{color:var(--accent)}
.kpi-eoy-label{color:var(--gold)}

/* ── TASKS ── */
.tasks-list{display:flex;flex-direction:column;gap:12px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.task-card-title{font-weight:700;font-size:15px;margin-bottom:6px}
.task-card-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.task-card-action{font-size:12px;color:var(--text3);background:var(--bg);border-radius:6px;padding:8px 10px;margin-bottom:12px;line-height:1.5;font-style:italic}
.task-assignees{display:flex;flex-wrap:wrap;gap:6px}
.task-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);transition:all .12s}
.task-chip:hover{border-color:var(--accent);color:var(--accent)}
.task-chip.sel{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600}
.task-priority{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.task-priority.high{background:#fde8e8;color:#c43c3c}
.task-priority.medium{background:var(--gold-light);color:var(--gold)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;text-align:center;max-width:360px;width:90%;box-shadow:var(--shadow-md)}
.login-logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.login-error{font-size:13px;color:#c94040;background:#fdeaea;border-radius:8px;padding:10px 14px;margin-top:16px;display:none}
.login-error.show{display:block}
#login-screen .g_id_signin{display:flex;justify-content:center}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  :root{--sidebar-w:220px}
  .sidebar{position:fixed;top:var(--header-h);bottom:0;left:0;z-index:50;box-shadow:var(--shadow-md);transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .kpi-row{grid-template-columns:1fr}
  .ct-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

}

    { title:'Personal Development', obj:'Personal Development - Strengthen strategic quality leadership capability.', kpi:'Attend at least one advanced regulatory or quality-focused and one AI learning course/webinar.\nDevelop executive-level quality reporting template for management review.', midReview:'', midScore:0, reviewEoy:'', scoreEoy:0 },
  ],
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let personData = {};
let ctData = {};
let taskData = {};
let currentPage = 'home';
let sidebarOpen = true;
let saveTimer = null;

// ═══════════════════════════════════════════════════════
// LOAD / SAVE
// ═══════════════════════════════════════════════════════
async function loadData() {
  setLoading('Loading company targets…');

  // Load CT
  const ct = await sbGet('ffct3');
  ctData = ct || {};

  // Load tasks
  const td = await sbGet('fftask3');
  taskData = td || {};

  // Load each person's KPIs
  setLoading('Loading team KPIs…');

  // First load the legacy shared key (ffkpi3) — this has all real team data
  let legacy = null;
  try { legacy = await sbGet('ffkpi3'); } catch(e) {}

  await Promise.all(TEAM.map(async m => {
    const key = `kpi_person_${m.id}`;
    let data = null;
    try { data = await sbGet(key); } catch(e) {}

    if (data && data.kpis) {
      personData[m.id] = data;
    } else if (legacy && legacy[m.id] && legacy[m.id].kpis) {
      const converted = legacy[m.id].kpis.map((k, i) => ({
        title: k.obj ? k.obj.slice(0, 50) : (i < 4 ? `KPI ${i+1}` : 'Personal Development'),
        obj: k.obj || '',
        kpi: k.kpi || '',
        midReview: k.selfMid || '',
        midScore: k.scoreMid || 0,
        midManagerReview: k.reviewMid || '',
        reviewEoy: k.selfEoy || '',
        scoreEoy: k.scoreEoy || 0,
        reviewEoyManager: k.reviewEoy || '',
      }));
      personData[m.id] = { kpis: converted };
    } else {
      personData[m.id] = { kpis: DEFAULT_KPIS[m.id] || Array(5).fill(null).map((_,i) => ({
        title: i < 4 ? `KPI ${i+1}` : 'Personal Development',
        obj:'', kpi:'', midReview:'', midScore:0, reviewEoy:'', scoreEoy:0
      })) };
    }
  }));
}

async function saveAll() {
  // Save CT
  await sbSet('ffct3', ctData);
  // Save tasks
  await sbSet('fftask3', taskData);
  // Save each person
  await Promise.all(TEAM.map(m => sbSet(`kpi_person_${m.id}`, personData[m.id])));
  showToast();
}

function autosave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 1800);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setLoading(msg) {
  document.getElementById('loading-msg').textContent = msg;
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function go(page) {
  currentPage = page;
  renderSidebar();
  if (page === 'home') renderHome();
  else if (page === 'overview') renderOverview();
  else if (page === 'tasks') renderTasks();
  else renderPerson(page);
  window.scrollTo(0,0);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open');
  } else {
    sidebarOpen = !sidebarOpen;
    sb.style.display = sidebarOpen ? '' : 'none';
  }
}

// ═══════════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════════
function renderSidebar() {
  const regions = [
    { key:'NL', label:'🇳🇱 Netherlands' },
    { key:'UK', label:'🇬🇧 United Kingdom' },
    { key:'UG', label:'🇺🇬 Uganda' },
    { key:'KE', label:'🇰🇪 Kenya' },
  ];
  let h = `<div class="nav-section">
    <div class="nav-item ${currentPage==='home'?'active':''}" onclick="go('home')"><div class="nav-icon">🏠</div> Company Home</div>
    <div class="nav-item ${currentPage==='overview'?'active':''}" onclick="go('overview')"><div class="nav-icon">📊</div> Team Overview</div>
    <div class="nav-item ${currentPage==='tasks'?'active':''}" onclick="go('tasks')"><div class="nav-icon">📋</div> Shared Tasks</div>
  </div>`;
  regions.forEach(({key, label}) => {
    const members = TEAM.filter(m => m.region === key);
    if (!members.length) return;
    h += `<div class="nav-section"><div class="region-label">${label}</div>`;
    members.forEach(m => {
      h += `<div class="nav-item ${currentPage===m.id?'active':''}" onclick="go('${m.id}')">
        <div class="nav-avatar" style="background:${avColor(m.id)}">${initials(m.name)}</div>
        <div><div style="font-weight:500">${m.name}</div><div style="font-size:11px;color:var(--text3)">${m.role}</div></div>
      </div>`;
    });
    h += `</div>`;
  });
  document.getElementById('sidebar').innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// HOME (COMPANY TARGETS)
// ═══════════════════════════════════════════════════════

    h += `<div class="ct-card ${t.pink?'pink':'green'}">

    h += `<div class="ct-card ${t.pink?'pink':'green'}">
      <div class="ct-card-label">${t.label}</div>
      <input class="ct-input" value="${esc(val)}" oninput="ctData['${t.id}']=this.value;autosave()">

  });
  h += `</div>`;

  h += `<div class="ct-section-title">⚙️ Operational Targets</div><div class="ct-grid">`;
  CT_OPS.forEach(t => {
    const val = ctData[t.id] ?? t.def;
    h += `<div class="ct-card ${t.pink?'pink':'green'}">
      <div class="ct-card-label">${t.label}</div>
      <input class="ct-input" value="${esc(val)}" oninput="ctData['${t.id}']=this.value;autosave()">
      <div class="ct-card-desc">${t.desc}</div>
    </div>`;
  });
  h += `</div>`;

  const notes = ctData['__notes'] || `2026 is the year of truth.\n\nWith our current dream team, we will prove our business case, reach break-even point, and be ready for scale. We will get there by keeping our focus sharp — on our company KPIs and on every individual's targets.\n\nTake time to create and review your own KPIs, and read through those of your colleagues. Discuss them with the people closest to you in your work, so we stay aligned and on the path to our breakthrough.\n\nQ1 is for getting set. Use this time to finalise your KPIs and get familiar with the tracker. The first formal review will take place mid-year — that's your moment to reflect, adjust, and accelerate into the second half.\n\nLet's make 2026 count. 🌱`;

    <div class="ct-notes-label">📝 Company Strategy Note</div>

  </div>`;

// ═══════════════════════════════════════════════════════
// TEAM OVERVIEW
// ═══════════════════════════════════════════════════════
function renderOverview() {
  const mc = document.getElementById('main-content');
  const regions = [
    { key:'NL', label:'🇳🇱 Netherlands' },
    { key:'UK', label:'🇬🇧 United Kingdom' },
    { key:'UG', label:'🇺🇬 Uganda' },
    { key:'KE', label:'🇰🇪 Kenya' },
  ];
  let h = `<div class="page-header"><div class="page-title">Team Overview</div><div class="page-sub">KPI completion across all ${TEAM.length} team members</div></div>`;
  regions.forEach(({key, label}) => {
    const members = TEAM.filter(m => m.region === key);
    if (!members.length) return;
    h += `<div class="ct-section-title">${label}</div><div class="overview-grid">`;
    members.forEach(m => {
      const kpis = personData[m.id]?.kpis || [];
      const done = kpis.filter(k => k.obj && k.obj.trim() && k.kpi && k.kpi.trim()).length;
      const pct = (done / 5) * 100;
      h += `<div class="ov-card" onclick="go('${m.id}')">
        <div class="ov-avatar" style="background:${avColor(m.id)}">${initials(m.name)}</div>
        <div class="ov-name">${m.name}</div>
        <div class="ov-role">${m.role}</div>
        <div class="ov-prog"><div class="ov-prog-bar" style="width:${pct}%"></div></div>
        <div class="ov-prog-label">${done}/5 KPIs set</div>
      </div>`;
    });
    h += `</div>`;
  });
  mc.innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// PERSON KPI VIEW
// ═══════════════════════════════════════════════════════

  const member = TEAM.find(m => m.id === id);
  if (!member) return;
  if (!personData[id]) personData[id] = { kpis: DEFAULT_KPIS[id] || [] };

  const flagMap = { NL:'🇳🇱', UK:'🇬🇧', UG:'🇺🇬', KE:'🇰🇪' };

    <div class="person-avatar-lg" style="background:${avColor(id)}">${initials(member.name)}</div>
    <div>

      <div class="person-role">${member.role} · ${member.region}</div>
    </div>
  </div>
  <div class="kpi-cards">`;

    const isPersonal = i === 4;

    h += `<div class="kpi-card" id="${cardId}">
      <div class="kpi-card-header" onclick="toggleKpi('${cardId}')">

          <input style="width:100%;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text1);cursor:text" 
            value="${esc(kpi.title||'')}" 
            onclick="event.stopPropagation()"
            oninput="personData['${id}'].kpis[${i}].title=this.value;autosave()"

        <div class="kpi-row">
          <div>
            <div class="kpi-field-label">Objective / Goal</div>

          </div>
          <div>
            <div class="kpi-field-label">KPI / Metric</div>
            <textarea class="kpi-textarea" rows="3" placeholder="How will you measure success?" oninput="personData['${id}'].kpis[${i}].kpi=this.value;autosave()">${esc(kpi.kpi||'')}</textarea>

              <div class="kpi-field-label">Self-Assessment</div>

              <div class="score-wrap">

                <div class="score-stars">${[1,2,3,4,5].map(n=>`<span class="star ${(kpi.midScore||0)>=n?'on':''}" onclick="personData['${id}'].kpis[${i}].midScore=${n};autosave();go('${id}')">★</span>`).join('')}</div>
              </div>
              <div style="margin-top:10px">
                <div class="kpi-field-label">Mid-Year Manager Review</div>

        <div class="kpi-eoy">

              <div class="kpi-field-label">Self-Assessment</div>
              <textarea class="kpi-textarea" rows="2" placeholder="Your year-end reflection…" oninput="personData['${id}'].kpis[${i}].reviewEoy=this.value;autosave()">${esc(kpi.reviewEoy||'')}</textarea>

            <div>
              <div class="score-wrap">
                <div class="kpi-field-label">End-of-Year Score</div>
                <div class="score-stars">${[1,2,3,4,5].map(n=>`<span class="star ${(kpi.scoreEoy||0)>=n?'on':''}" onclick="personData['${id}'].kpis[${i}].scoreEoy=${n};autosave();go('${id}')">★</span>`).join('')}</div>

function toggleKpi(cardId) {
  const card = document.getElementById(cardId);
  if (card) card.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════
// TASKS
// ═══════════════════════════════════════════════════════
function renderTasks() {
  const mc = document.getElementById('main-content');
  let h = `<div class="page-header"><div class="page-title">Shared Tasks</div><div class="page-sub">Responsibilities not yet covered by individual KPIs — assign team members</div></div><div class="tasks-list">`;
  TASKS.forEach(t => {
    const td = taskData[t.id] || { assignees: [] };
    h += `<div class="task-card">
      <div class="task-priority ${t.priority}">${t.priority} priority</div>
      <div class="task-card-title">${t.title}</div>
      <div class="task-card-desc">${t.desc}</div>
      <div class="task-card-action">${t.action}</div>
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Assign team members</div>
      <div class="task-assignees">`;
    TEAM.forEach(m => {
      const sel = td.assignees && td.assignees.includes(m.id);
      h += `<div class="task-chip ${sel?'sel':''}" onclick="toggleAssignee('${t.id}','${m.id}')">${m.name}</div>`;
    });
    h += `</div></div>`;
  });
  h += `</div>`;
  mc.innerHTML = h;
}

function toggleAssignee(taskId, memberId) {
  if (!taskData[taskId]) taskData[taskId] = { assignees: [] };
  const arr = taskData[taskId].assignees;
  const idx = arr.indexOf(memberId);
  if (idx > -1) arr.splice(idx, 1);
  else arr.push(memberId);
  autosave();
  renderTasks();
}

// ═══════════════════════════════════════════════════════
// GOOGLE AUTH
// ═══════════════════════════════════════════════════════
const ALLOWED_DOMAIN = 'fiberfoodsgroup.com';
let currentUser = null;

function parseJwt(token) {
  try {
    return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  } catch(e) { return null; }
}

function handleGoogleLogin(response) {
  const payload = parseJwt(response.credential);
  if (!payload) return showLoginError();
  const email = payload.email || '';
  if (!email.endsWith('@' + ALLOWED_DOMAIN)) {
    return showLoginError();
  }
  currentUser = { email, name: payload.name, picture: payload.picture };
  document.getElementById('login-screen').style.display = 'none';
  startApp();
}

function showLoginError() {
  document.getElementById('login-error').classList.add('show');
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function startApp() {
  try {
    await loadData();
  } catch(e) {
    console.error(e);
    document.getElementById('loading-msg').textContent = 'Connection error — working offline with defaults';
    await new Promise(r => setTimeout(r, 1500));
  }
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  renderHome();
}

function init() {
  // Login screen is shown by default — Google GSI handles the rest
  // Loading screen stays hidden until login succeeds
  document.getElementById('loading-screen').style.display = 'none';
}

init();
</script>
